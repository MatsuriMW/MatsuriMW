<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 216" width="840" height="216" role="img" aria-label="马自立：用 Agent 把想法做成能用的东西">
<style>
  :root { --ink: #1f2328; --muted: #656d76; --track: #dfe3e8; --chip: #f3f5f7; }
  @media (prefers-color-scheme: dark) { :root { --ink: #e6edf3; --muted: #9198a1; --track: #30363d; --chip: #21262d; } }
  text { font-family: -apple-system, "PingFang SC", "Segoe UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  .track { fill: none; stroke: var(--track); stroke-width: 11; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.6s cubic-bezier(.3,.2,.2,1) forwards; }
  .seg { fill: none; stroke-width: 11; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .6s cubic-bezier(.2,.7,.2,1) forwards; }
  .lane { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .6s cubic-bezier(.2,.7,.2,1) forwards; }
  .done { stroke: #aab1ba; } .task { stroke: #2b64c3; } .event { stroke: #e3a924; } .prio { stroke: #d03739; } .review { stroke: #31b0c6; }
  .claude { stroke: #d97757; } .codex { stroke: #62b0ea; } .wb { stroke: #17a57f; }
  .live { animation: draw .6s cubic-bezier(.2,.7,.2,1) forwards, breathe 2.8s ease-in-out 2.4s infinite; }
  .hand { stroke: var(--ink); stroke-width: 1.3; stroke-linecap: round; opacity: .55; }
  .dot { fill: var(--ink); stroke: var(--track); stroke-width: 1.5; }
  .halo { fill: var(--ink); transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-out 2s infinite; opacity: 0; }
  .now { transform-origin: 120px 120px; animation: sweep 1.4s cubic-bezier(.2,.8,.2,1) .5s backwards; }
  .name { font-size: 46px; font-weight: 800; fill: var(--ink); letter-spacing: 2px; }
  .handle { font-size: 15px; fill: var(--muted); letter-spacing: .5px; }
  .tag { font-size: 19px; font-weight: 600; fill: var(--ink); }
  .cursor { fill: #d97757; animation: blink 1s steps(1) infinite; }
  .chip rect { fill: var(--chip); }
  .chip text { font-size: 13px; fill: var(--muted); }
  .chip { opacity: 0; animation: rise .5s cubic-bezier(.2,.7,.2,1) forwards; }
  .rise { opacity: 0; animation: rise .6s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes breathe { 50% { opacity: .5; } }
  @keyframes pulse { from { transform: scale(1); opacity: .35; } to { transform: scale(3.4); opacity: 0; } }
  @keyframes sweep { from { transform: rotate(-70deg); opacity: 0; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .track, .seg, .lane { stroke-dashoffset: 0; } .chip, .rise { opacity: 1; } }
</style>
